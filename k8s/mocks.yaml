# Cosmetic services so the cluster map looks like a streaming platform. Not autoscaled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway, tier: streaming }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway, tier: streaming }
    spec:
      containers:
        - name: gateway
          image: playback-api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: gateway }
            - { name: WORK_ITERATIONS, value: "0" }
            - { name: STARTUP_DELAY_SECONDS, value: "0" }
          resources:
            requests: { cpu: "25m", memory: "48Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
          ports: [{ name: http, containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: { app: catalog, tier: streaming }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata:
      labels: { app: catalog, tier: streaming }
    spec:
      containers:
        - name: catalog
          image: playback-api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: catalog }
            - { name: WORK_ITERATIONS, value: "0" }
            - { name: STARTUP_DELAY_SECONDS, value: "0" }
          resources:
            requests: { cpu: "25m", memory: "48Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
          ports: [{ name: http, containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector: { app: catalog }
  ports: [{ name: http, port: 80, targetPort: http }]
