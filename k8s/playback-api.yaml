apiVersion: apps/v1
kind: Deployment
metadata:
  name: playback-api
  labels: { app: playback-api, tier: streaming }
spec:
  replicas: 2
  selector:
    matchLabels: { app: playback-api }
  template:
    metadata:
      labels: { app: playback-api, tier: streaming }
    spec:
      # prefer active nodes; reserve nodes are used only after the arbiter uncordons one
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: NotIn
                    values: ["reserve"]
      containers:
        - name: playback-api
          image: playback-api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: playback-api
            - name: WORK_ITERATIONS
              value: "400000"
            - name: STARTUP_DELAY_SECONDS
              value: "20"          # makes scaling lag visible, as in the design doc
          resources:
            # one slot per pod caps each node at SLOTS_PER_NODE app pods, because every
            # k3d node reports the whole VM's CPU and would otherwise never run out of room
            requests: { cpu: "150m", memory: "64Mi", autoscaler.demo/slot: "1" }
            limits: { cpu: "300m", memory: "192Mi", autoscaler.demo/slot: "1" }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: playback-api
  labels: { app: playback-api }
spec:
  type: NodePort
  selector: { app: playback-api }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
